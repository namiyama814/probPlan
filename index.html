<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ProbPlanは、不確実なタスクを3点見積もりで予測し、プロジェクトの進捗と完了見通しを整理できるタスク管理ツールです。">
  <meta property="og:site_name" content="ProbPlan">
  <meta property="og:title" content="ProbPlan">
  <meta property="og:description" content="不確実なタスクを3点見積もりで予測し、プロジェクトの進捗と完了見通しを整理できるタスク管理ツールです。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:image" content="./image/probplan_ogp.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ProbPlan">
  <meta name="twitter:description" content="不確実なタスクを3点見積もりで予測し、プロジェクトの進捗と完了見通しを整理できるタスク管理ツールです。">
  <meta name="twitter:image" content="./image/probplan_ogp.png">
  <script>
    try {
      const theme = localStorage.getItem("probplan-theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      }
    } catch {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css">
  <title>ProbPlan</title>
</head>

<body class="bg-[var(--color-bg)] text-[var(--color-text)] antialiased min-h-screen flex items-center justify-center">

  <button
    id="theme-toggle"
    type="button"
    class="fixed right-5 top-5 z-40 flex h-10 w-10 items-center justify-center rounded-full border border-[var(--color-text)]/10 bg-[var(--color-surface)] shadow-sm transition-colors hover:bg-[var(--color-text)]/5"
  ></button>

  <main class="max-w-3xl w-full px-6">

    <nav
      class="home-panel-tabs mb-4 rounded-full border border-[var(--color-text)]/10 bg-[var(--color-surface)] p-1 md:hidden"
      aria-label="ホーム画面の表示切り替え"
    >
      <div class="relative grid grid-cols-2 gap-1">
        <button
          id="home-project-tab"
          type="button"
          class="home-panel-tab rounded-full px-3 py-2 text-sm font-medium transition-colors"
          data-target-panel="project-section"
          aria-controls="project-section"
          aria-selected="true"
        >
          プロジェクト
        </button>

        <button
          id="home-task-tab"
          type="button"
          class="home-panel-tab rounded-full px-3 py-2 text-sm font-medium transition-colors"
          data-target-panel="task-section"
          aria-controls="task-section"
          aria-selected="false"
        >
          タスク一覧
        </button>
      </div>
    </nav>

    <div id="home-panel-scroll" class="home-panel-scroll overflow-x-auto snap-x snap-mandatory">
      <div class="flex gap-6 md:grid md:grid-cols-2 md:min-w-0">

        <section id="project-section"
          class="w-[85vw] shrink-0 snap-start md:w-auto min-h-80 bg-[var(--color-surface)] rounded-md border border-[var(--color-text)]/10 p-6">
        </section>

        <section id="task-section"
          class="w-[85vw] shrink-0 snap-start md:w-auto min-h-80 bg-[var(--color-surface)] rounded-md border border-[var(--color-text)]/10 p-6">
        </section>

      </div>
    </div>

  </main>

  <script type="module" src="./js/app.js"></script>

</body>
</html>

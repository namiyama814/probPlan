<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css">
  <title>ProbPlan</title>
</head>

<body class="bg-[var(--color-bg)] text-[var(--color-text)] antialiased min-h-screen flex items-center justify-center">

  <main class="max-w-3xl w-full px-6">

    <div class="overflow-x-auto snap-x snap-mandatory">
      <div class="flex gap-6 md:grid md:grid-cols-2 md:min-w-0">

        <section id="project-section"
          class="w-[85vw] shrink-0 snap-start md:w-auto min-h-80 bg-white rounded-md border border-[var(--color-text)]/10 p-6">
        </section>

        <section id="task-section"
          class="w-[85vw] shrink-0 snap-start md:w-auto min-h-80 bg-white rounded-md border border-[var(--color-text)]/10 p-6">
        </section>

      </div>
    </div>

  </main>

  <script type="module" src="./js/app.js"></script>

</body>
</html>

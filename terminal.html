<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ProbPlan CLIは、コマンド入力でプロジェクトやタスクを操作できるProbPlanのターミナル画面です。">
  <meta property="og:site_name" content="ProbPlan">
  <meta property="og:title" content="ProbPlan CLI">
  <meta property="og:description" content="コマンド入力でプロジェクトやタスクを操作できるProbPlanのターミナル画面です。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:image" content="./image/probplan_ogp.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ProbPlan CLI">
  <meta name="twitter:description" content="コマンド入力でプロジェクトやタスクを操作できるProbPlanのターミナル画面です。">
  <meta name="twitter:image" content="./image/probplan_ogp.png">
  <link rel="icon" data-app-favicon="true" href="./image/favicon_light.ico" type="image/x-icon">
  <script>
    try {
      const theme = localStorage.getItem("probplan-theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      }
    } catch {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css">
  <title>CLI - ProbPlan</title>
</head>

<body class="bg-[var(--color-bg)] text-[var(--color-text)] antialiased min-h-screen">

  <button
    id="theme-toggle"
    type="button"
    class="fixed right-5 top-5 z-40 flex h-10 w-10 items-center justify-center rounded-full border border-[var(--color-text)]/10 bg-[var(--color-surface)] transition-colors hover:bg-[var(--color-text)]/5"
  ></button>

  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col px-4 py-8 sm:px-6 sm:py-12">
    <header class="mb-6">
      <div>
        <p class="text-sm text-[var(--color-muted)]">ProbPlan command line</p>
        <h1 class="mt-1 text-3xl font-semibold tracking-tight">CLI</h1>
        <p class="mt-2 text-sm text-[var(--color-muted)]">
          Type <code class="rounded bg-[var(--color-text)]/5 px-1.5 py-0.5">exit</code> to return to the GUI.
          Add <code class="rounded bg-[var(--color-text)]/5 px-1.5 py-0.5">--ja</code> for Japanese output.
        </p>
      </div>
    </header>

    <section
      class="terminal-shell flex flex-col rounded-2xl border border-[var(--terminal-border)] shadow-2xl shadow-black/10"
      aria-label="ProbPlan CLI"
    >
      <div id="terminal-titlebar" class="terminal-titlebar flex items-center gap-2 px-4 py-3">
        <div id="terminal-window-controls" class="terminal-window-controls" aria-hidden="true"></div>
        <span class="terminal-shell-label ml-2 text-xs">/terminal.html</span>
      </div>

      <div
        id="terminal-output"
        class="terminal-output flex-1 overflow-y-auto p-4 font-mono text-sm leading-6"
        aria-live="polite"
      ></div>

      <form id="terminal-form" class="border-t border-[var(--terminal-border)] p-4">
        <label class="flex items-center gap-3 font-mono text-sm">
          <span class="terminal-accent">$</span>
          <input
            id="terminal-input"
            type="text"
            class="terminal-input min-w-0 flex-1 border-0 bg-transparent p-0 font-mono outline-none"
            autocomplete="off"
            spellcheck="false"
            placeholder='Type help to see available commands'
          >
        </label>
      </form>
    </section>
  </main>

  <script type="module" src="./js/terminal.js"></script>

</body>
</html>

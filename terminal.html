<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ProbPlan CLIは、コマンド入力でプロジェクトやタスクを操作できるProbPlanのターミナル画面です。">
  <meta property="og:site_name" content="ProbPlan">
  <meta property="og:title" content="ProbPlan CLI">
  <meta property="og:description" content="コマンド入力でプロジェクトやタスクを操作できるProbPlanのターミナル画面です。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:image" content="./image/probplan_ogp.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ProbPlan CLI">
  <meta name="twitter:description" content="コマンド入力でプロジェクトやタスクを操作できるProbPlanのターミナル画面です。">
  <meta name="twitter:image" content="./image/probplan_ogp.png">
  <script>
    try {
      const theme = localStorage.getItem("probplan-theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      }
    } catch {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css">
  <title>ProbPlan CLI</title>
</head>

<body class="bg-[var(--color-bg)] text-[var(--color-text)] antialiased min-h-screen">

  <button
    id="theme-toggle"
    type="button"
    class="fixed right-5 top-5 z-40 flex h-10 w-10 items-center justify-center rounded-full border border-[var(--color-text)]/10 bg-[var(--color-surface)] shadow-sm transition-colors hover:bg-[var(--color-text)]/5"
  ></button>

  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col px-4 py-8 sm:px-6 sm:py-12">
    <header class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm text-[var(--color-muted)]">ProbPlan command line</p>
        <h1 class="mt-1 text-3xl font-semibold tracking-tight">CLI</h1>
        <p class="mt-2 text-sm text-[var(--color-muted)]">
          ここで作成・更新したプロジェクトやタスクは、ホーム画面と詳細画面にも反映されます。
        </p>
      </div>

      <a
        href="./index.html"
        class="inline-flex items-center justify-center rounded-full border border-[var(--color-text)]/10 bg-[var(--color-surface)] px-4 py-2 text-sm font-medium transition hover:bg-[var(--color-text)]/5"
      >
        GUIに戻る
      </a>
    </header>

    <section
      class="terminal-shell flex min-h-[70vh] flex-1 flex-col rounded-2xl border border-[var(--color-text)]/10 bg-[#101214] shadow-2xl shadow-black/10"
      aria-label="ProbPlan CLI"
    >
      <div class="flex items-center gap-2 border-b border-white/10 px-4 py-3">
        <span class="h-3 w-3 rounded-full bg-[#ff5f57]"></span>
        <span class="h-3 w-3 rounded-full bg-[#ffbd2e]"></span>
        <span class="h-3 w-3 rounded-full bg-[#28c840]"></span>
        <span class="ml-2 text-xs text-white/45">/terminal.html</span>
      </div>

      <div
        id="terminal-output"
        class="terminal-output flex-1 overflow-y-auto p-4 font-mono text-sm leading-6 text-[#d7f9df]"
        aria-live="polite"
      ></div>

      <form id="terminal-form" class="border-t border-white/10 p-4">
        <label class="flex items-center gap-3 font-mono text-sm text-[#d7f9df]">
          <span class="text-[#8be28b]">$</span>
          <input
            id="terminal-input"
            type="text"
            class="terminal-input min-w-0 flex-1 border-0 bg-transparent p-0 font-mono text-[#d7f9df] outline-none placeholder:text-white/30"
            autocomplete="off"
            spellcheck="false"
            placeholder='help と入力すると使い方を表示します'
          >
        </label>
      </form>
    </section>
  </main>

  <script type="module" src="./js/terminal.js"></script>

</body>
</html>
